<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">João Pedro Fernandes — Software Developer</title>
  <desc id="desc">Banner em grafite e verde, com o nome João Pedro Fernandes e um terminal que conecta ideias, código e produtos.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D171C"/>
      <stop offset="1" stop-color="#10171F"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="1152" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#24343C" stroke-opacity=".45"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="url(#surface)" stroke="#2C3A42" stroke-width="2"/>
  <rect x="684" y="25" width="486" height="368" rx="16" fill="url(#grid)"/>
  <path d="M48 1H1152" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="56" y="62" fill="#8FA5AD" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="3">JOÃO PEDRO / SOFTWARE DEVELOPER</text>
    <text x="52" y="151" fill="#F1F5F9" font-size="78" font-weight="700" letter-spacing="-3">João Pedro</text>
    <text x="52" y="234" fill="#F1F5F9" font-size="78" font-weight="700" letter-spacing="-3">Fernandes<tspan fill="#6EE7B7">.</tspan></text>
    <text x="56" y="288" fill="#C2D1D7" font-size="22">Ideias viram sistemas.</text>
    <text x="56" y="320" fill="#C2D1D7" font-size="22">Sistemas simplificam rotinas.</text>
    <circle cx="62" cy="371" r="5" fill="#6EE7B7"/>
    <text x="78" y="377" fill="#8FA5AD" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">PHP / LARAVEL / REACT / VUE</text>
  </g>
  <g transform="translate(708 94)">
    <rect width="436" height="246" rx="14" fill="#0B1218" stroke="#31434B"/>
    <path d="M1 45H435" stroke="#26353E"/>
    <circle cx="22" cy="23" r="5" fill="#6EE7B7"/>
    <circle cx="40" cy="23" r="5" fill="#37575B"/>
    <circle cx="58" cy="23" r="5" fill="#37575B"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
      <text x="271" y="29" fill="#8198A3" font-size="13">~/workspace</text>
      <text x="26" y="88" fill="#6EE7B7">❯ <tspan fill="#DFE9ED">build --with-purpose</tspan></text>
      <text x="26" y="128" fill="#8198A3">01 <tspan fill="#C1D4DC">entender o problema</tspan></text>
      <text x="26" y="160" fill="#8198A3">02 <tspan fill="#C1D4DC">conectar as peças</tspan></text>
      <text x="26" y="192" fill="#8198A3">03 <tspan fill="#C1D4DC">construir a solução</tspan></text>
      <text x="26" y="225" fill="#6EE7B7">❯</text>
    </g>
    <rect x="49" y="212" width="9" height="17" rx="1" fill="#6EE7B7"/>
  </g>
</svg>
