<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">João Pedro Fernandes — do código à operação</title>
  <desc id="desc">Banner editorial preto e marfim com o pequeno robô de jetpack do portfólio.</desc>
  <style>
    .label{font:14px 'SFMono-Regular',Consolas,monospace;letter-spacing:2.5px;fill:#b5b2a8}
    .name{font:108px Impact,'Arial Narrow',sans-serif;letter-spacing:-2px;fill:#eeeade}
    .line{stroke:#393935;stroke-width:1}
    .bob{animation:bob 4.8s ease-in-out infinite;transform-origin:48px 52px}
    .flame{animation:flame 1.5s ease-in-out infinite}
    .eyes{animation:blink 7s steps(1,end) infinite}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(3deg)}}
    @keyframes flame{0%,100%{opacity:.58}50%{opacity:1}}
    @keyframes blink{0%,45%,47%,100%{opacity:1}46%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.bob,.flame,.eyes{animation:none}}
  </style>
  <rect width="1200" height="430" fill="#101010"/>
  <rect x="1" y="1" width="1198" height="428" fill="none" stroke="#393935" stroke-width="2"/>
  <path class="line" d="M42 76H1158M42 340H1158M855 76V340"/>
  <text class="label" x="44" y="48">DESENVOLVEDOR FULL STACK</text>
  <text class="label" x="1033" y="48">BR / 2026</text>
  <text class="name" x="42" y="183">JOÃO PEDRO</text>
  <text class="name" x="42" y="293">FERNANDES<tspan fill="none" stroke="#eeeade" stroke-width="2">.</tspan></text>
  <text class="label" x="44" y="381">DO CÓDIGO À OPERAÇÃO.</text>
  <text class="label" x="44" y="406">SISTEMAS PARA O MUNDO REAL.</text>
  <text class="label" x="951" y="391">JP / 001</text>
  <path d="M875 329h15m-7-7v14M1105 98h13m-6-6v12" stroke="#b5b2a8" stroke-width="1.5"/>
  <path d="M900 268c25 0 42 23 61 23M1065 126c-17 0-24-11-39-11" stroke="#77766e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 7"/>
  <circle cx="990" cy="205" r="108" fill="none" stroke="#393935" stroke-width="1" stroke-dasharray="2 8"/>
  <g transform="translate(942 123) scale(1.05)"><g class="bob">
    <g fill="#101010"><rect x="22" y="56" width="15" height="28" rx="7"/><rect x="59" y="56" width="15" height="28" rx="7"/></g>
    <g class="flame" fill="#eeeade"><path d="M25 84h9c0 7-2 12-4.5 14C27 96 25 91 25 84Z"/><path d="M62 84h9c0 7-2 12-4.5 14C64 96 62 91 62 84Z"/></g>
    <g fill="#eeeade"><rect x="23" y="77" width="13" height="7" rx="3"/><rect x="60" y="77" width="13" height="7" rx="3"/><path d="M31 64c-4-2-8 0-10 4l-3 6c-2 5 5 8 8 4l6-7c2-3 2-5-1-7Z"/><path d="M65 64c4-2 8 0 10 4l3 6c2 5-5 8-8 4l-6-7c-2-3-2-5 1-7Z"/><rect x="31" y="57" width="34" height="30" rx="12"/><rect x="46" y="7" width="4" height="12" rx="2"/><circle cx="48" cy="6" r="4"/><rect x="11" y="33" width="10" height="14" rx="5"/><rect x="75" y="33" width="10" height="14" rx="5"/><rect x="15" y="15" width="66" height="48" rx="19"/></g>
    <g fill="#101010"><rect x="42" y="71" width="12" height="5" rx="2.5"/><rect x="22" y="24" width="52" height="31" rx="13"/></g>
    <g class="eyes" fill="#eeeade"><ellipse cx="36" cy="39" rx="5" ry="7.5"/><ellipse cx="59" cy="38" rx="5.5" ry="8.5"/></g>
  </g></g>
</svg>
